[project]
name = "rolo"
version = "0.1.0"
description = "Evidence-backed robot adaptation, diagnosis, and verification toolkit"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "openai>=1.99,<3",
  "packaging>=24,<27",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6.0,<7",
  "tomli>=2.0,<3; python_version < '3.11'",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
rolo = "rolo.product_cli:app"
robotctl = "rolo.cli:app"
rolo-mcp = "rolo.mcp_server:main"
rolo-vis = "rolo.vis:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rolo"]

[tool.hatch.build.targets.wheel.force-include]
"skills/rolo-adapt-discovery" = "rolo/bundled_skills/rolo-adapt-discovery"
"skills/rolo-operation-mapping" = "rolo/bundled_skills/rolo-operation-mapping"
"skills/rolo-wiki-authoring" = "rolo/bundled_skills/rolo-wiki-authoring"
"skills/rolo" = "rolo/bundled_skills/rolo"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "lerobot: opt-in integration test requiring a separately installed LeRobot checkout",
  "ssh: opt-in integration test requiring OpenSSH client and server",
]

[tool.coverage.run]
source = ["src/rolo"]
parallel = true

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2
# Baseline for the existing suite; raise this ratchet after M1/M2 land.
fail_under = 84.00

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
