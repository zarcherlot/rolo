    capability_requirements:
      [typed parameter mutation route, protected OS write policy and exact operation allowlist,
        protected execution supervisor providing a bound quiescence lease]
    preconditions:
      - >-
        id resolves to a mutable non-SECRET parameter; expected_current_revision matches; the
        execution supervisor holds a robot-wide quiescence lease for the complete invocation.
    postconditions:
      - >-
        The response acknowledges the update request and returns a revision plus opaque rollback
        token; parameter state must be read separately and no process, task or motion is started.
    side_effects: [May change one persisted or in-memory application parameter value.]
    resource_locks: [application parameter identified by id, robot execution quiescence lease]
    input_schema:
      type: object
      properties:
        id: {type: string, minLength: 1}
        value:
          type: object
          properties:
            type: {type: string, enum: [boolean, integer, number, string, json]}
            value_json: {type: string, maxLength: 1000000}
          required: [type, value_json]
          additionalProperties: false
        expected_current_revision: {type: string, minLength: 1}
      required: [id, value, expected_current_revision]
      additionalProperties: false
    output_schema:
      type: object
      properties:
        status: {type: string}
        id: {type: string}
        revision: {type: string}
        rollback_token: {type: string}
        observed_at: {type: string}
      required: [status, id, revision, rollback_token, observed_at]
      additionalProperties: false

