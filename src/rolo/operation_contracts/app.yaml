            yaw_rad: {type: number}
          required: [frame_id, x_m, y_m, yaw_rad]
          additionalProperties: false
        goal:
          type: object
          properties:
            frame_id: {type: string}
            x_m: {type: number}
            y_m: {type: number}
            yaw_rad: {type: number}
          required: [frame_id, x_m, y_m, yaw_rad]
          additionalProperties: false
        planner_id: {type: string}
        max_points: {type: integer, minimum: 1, maximum: 5000}
        max_bytes: {type: integer, minimum: 1024, maximum: 10000000}
      required: [goal, max_points, max_bytes]
