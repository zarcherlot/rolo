schema_version: robot-operation-contract-set/v1

no_input: &no_input
  type: object
  properties: {}
  additionalProperties: false

status_output: &status_output
  type: object
  properties:
    status: {type: string}
  required: [status]
  additionalProperties: false

ack_output: &ack_output
  type: object
  properties:
    status: {type: string}
    observed_at: {type: string}
  required: [status, observed_at]
  additionalProperties: false

map_ack_output: &map_ack_output
  type: object
  properties:
    status: {type: string}
    map_id: {type: string}
    observed_at: {type: string}
  required: [status, map_id, observed_at]
  additionalProperties: false

run_ack_output: &run_ack_output
  type: object
  properties:
    status: {type: string}
    run_id: {type: string}
    observed_at: {type: string}
  required: [status, run_id, observed_at]
  additionalProperties: false

selector_input: &selector_input
  type: object
  properties: {id: {type: string, minLength: 1}}
  required: [id]
  additionalProperties: false

observable_item: &observable_item
  type: object
  properties:
    id: {type: string}
    name: {type: string}
    status: {type: string}
    health: {type: string}
    frame_id: {type: string}
  required: [id]
  additionalProperties: true

collection_output: &collection_output
  type: object
  properties:
    status: {type: string}
    items: {type: array, items: *observable_item}
    observed_at: {type: string}
  required: [status, items, observed_at]
  additionalProperties: false

detail_output: &detail_output
  type: object
  properties:
    status: {type: string}
    item: *observable_item
    observed_at: {type: string}
  required: [status, item, observed_at]
  additionalProperties: false

observed_status_output: &observed_status_output
  type: object
  properties:
    status: {type: string}
    id: {type: string}
    health: {type: string}
    details:
      type: object
      properties: {}
      additionalProperties: true
    observed_at: {type: string}
  required: [status, observed_at]
  additionalProperties: false

document_output: &document_output
  type: object
  properties:
    status: {type: string}
    data:
      type: object
      properties: {}
      additionalProperties: true
    observed_at: {type: string}
  required: [status, data, observed_at]
  additionalProperties: false

result_output: &result_output
  type: object
  properties:
    status: {type: string}
    id: {type: string}
    result: {type: object, properties: {}, additionalProperties: true}
    observed_at: {type: string}
  required: [status, id, result, observed_at]
  additionalProperties: false

evidence_output: &evidence_output
  type: object
  properties:
    status: {type: string}
    id: {type: string}
    artifacts:
      type: array
      maxItems: 256
      items:
        type: object
        properties:
          artifact_ref: {type: string, minLength: 1}
          media_type: {type: string}
          observed_at: {type: string}
        required: [artifact_ref]
        additionalProperties: false
    observed_at: {type: string}
  required: [status, id, artifacts, observed_at]
  additionalProperties: false

bounded_stream_output: &bounded_stream_output
  type: object
  properties:
    status: {type: string}
    observed_at: {type: string}
    truncated: {type: boolean}
    items:
      type: array
      items: {type: object, properties: {}, additionalProperties: true}
  required: [status, observed_at, truncated, items]
  additionalProperties: false

adapter_defaults: &adapter_defaults
  schema_version: robot-operation-contract/v1
  version: 1.1.0
  lifecycle: GATEABLE
  layer: app
  data_classification: INTERNAL
  max_duration_s: 30
  canonical_cli:
    [robotctl, tool, invoke, "{operation}", --robot, "{robot_id}", --input, "{input_json}"]
  error_codes: [UNAVAILABLE, TIMEOUT, INVALID_INPUT, OPERATION_FAILED]
  retry_policy: none

observation_defaults: &observation_defaults
  <<: *adapter_defaults
  risk: R0
  access: read
  idempotent: true
  cancelable: false
  retry_policy: bounded_exponential_backoff

mutation_defaults: &mutation_defaults
  <<: *adapter_defaults
  risk: R2
  access: write
  idempotent: false
  cancelable: false
  result_semantics: ACKNOWLEDGEMENT_ONLY
  output_schema: *ack_output
  error_codes:
    [UNAVAILABLE, NOT_AUTHORIZED, INVALID_TARGET, PRECONDITION_FAILED, TIMEOUT,
      OPERATION_FAILED]
  postconditions:
    [The response acknowledges command acceptance only; resulting state must be observed separately.]
  retry_policy: none

r3_run_defaults: &r3_run_defaults
  <<: *mutation_defaults
  data_classification: SENSITIVE
  risk: R3
  cancelable: true
  max_duration_s: 30
  output_schema: *run_ack_output
  error_codes:
    [UNAVAILABLE, NOT_AUTHORIZED, INVALID_TARGET, INVALID_PLAN, INTERLOCK_BLOCKED, BUSY,
      PRECONDITION_FAILED, TIMEOUT, OPERATION_FAILED]
  retry_policy: none

cancel_defaults: &cancel_defaults
  <<: *mutation_defaults
  data_classification: SENSITIVE
  idempotent: true
  output_schema: *run_ack_output
  capability_requirements:
    [target-bound run cancellation route, protected OS write policy and exact operation allowlist]
  postconditions:
    [The response acknowledges cancellation acceptance only; stopped state must be observed separately.]
  retry_policy: none

contracts:
  - schema_version: robot-operation-contract/v1
    contract_id: app.robot.discover
    version: 1.1.0
    lifecycle: RELEASED
    operation: app.robot.discover
    layer: app
    data_classification: INTERNAL
    description: Discover bounded application entrypoints and declared interfaces from supplied roots.
    risk: R0
    access: read
    idempotent: true
    cancelable: false
    max_duration_s: 30
    canonical_cli: [robotctl, app, robot, discover]
    input_schema:
      type: object
      properties:
        source_roots: {type: array, items: {type: string}}
      additionalProperties: false
    output_schema:
      type: object
      properties:
        layer: {type: string, enum: [application]}
        status: {type: string}
        data:
          type: object
          properties: {}
          additionalProperties: true
        warnings: {type: array, items: {type: string}}
        errors: {type: array, items: {type: string}}
        observed_at: {type: string}
      required: [layer, status, data, warnings, errors, observed_at]
      additionalProperties: false
    error_codes: [UNAVAILABLE, TIMEOUT, PROBE_FAILED]
    retry_policy: bounded_exponential_backoff

  - <<: *adapter_defaults
    contract_id: app.teleop.velocity
    operation: app.teleop.velocity
    description: Submit a bounded planar base velocity command in base_link coordinates.
    risk: R3
    access: write
    result_semantics: ACKNOWLEDGEMENT_ONLY
    idempotent: false
    cancelable: false
    capability_requirements: [planar mobile base velocity command route]
    preconditions: [Motion authorization and watchdog are active.]
    postconditions: [A command acknowledgement is returned; motion outcome is not asserted.]
    semantic_units: {linear_x_mps: m/s, angular_z_radps: rad/s}
    coordinate_frames: [base_link]
    time_semantics: The command is a transient setpoint governed by the target watchdog.
    side_effects: [May cause physical base motion.]
    resource_locks: [mobile_base_motion]
    error_codes: [UNAVAILABLE, TIMEOUT, INVALID_INPUT, NOT_AUTHORIZED,
      PRECONDITION_FAILED, OPERATION_FAILED]
    input_schema:
      type: object
      properties:
        linear_x_mps: {type: number}
        angular_z_radps: {type: number}
      required: [linear_x_mps, angular_z_radps]
      additionalProperties: false
    output_schema: *status_output

  - <<: *adapter_defaults
    contract_id: app.localization.status
    operation: app.localization.status
    description: Read localization readiness and bounded quality metadata without changing state.
    risk: R0
    access: read
    idempotent: true
    cancelable: false
    capability_requirements: [localization or odometry status route]
    coordinate_frames: [map, odom, base_link]
    input_schema: *no_input
    output_schema:
      type: object
      properties:
        status: {type: string}
        localized: {type: boolean}
        quality: {type: number, minimum: 0, maximum: 1}
        frame_id: {type: string}
      required: [status]
      additionalProperties: false
    retry_policy: bounded_exponential_backoff

  - <<: *adapter_defaults
    contract_id: app.map.inspect
    operation: app.map.inspect
    data_classification: SENSITIVE
    description: Read bounded metadata for the active or selected two-dimensional map.
    risk: R0
    access: read
    idempotent: true
    cancelable: false
    capability_requirements: [two-dimensional map metadata route]
    semantic_units: {resolution_m: m/cell}
    coordinate_frames: [map]
    input_schema:
      type: object
      properties: {map_id: {type: string}}
      additionalProperties: false
    output_schema:
      type: object
      properties:
        status: {type: string}
        map_id: {type: string}
        frame_id: {type: string}
        resolution_m: {type: number, minimum: 0}
        width: {type: integer, minimum: 0}
        height: {type: integer, minimum: 0}
      required: [status]
      additionalProperties: false
    retry_policy: bounded_exponential_backoff

  - <<: *adapter_defaults
    contract_id: app.camera.snapshot
    operation: app.camera.snapshot
    data_classification: SENSITIVE
    description: Capture or reference one bounded frame from a selected camera stream.
    risk: R0
    access: read
    idempotent: true
    cancelable: false
    capability_requirements: [camera image route]
    input_schema:
      type: object
      properties: {camera: {type: string}}
      additionalProperties: false
    output_schema:
      type: object
      properties:
        status: {type: string}
        camera: {type: string}
        artifact_ref: {type: string}
        timestamp: {type: string}
        frame_id: {type: string}
      required: [status]
      additionalProperties: false
    retry_policy: bounded_exponential_backoff

  - <<: *adapter_defaults
    contract_id: app.safety.emergency_stop
    operation: app.safety.emergency_stop
    description: Request the target safety controller to enter its emergency-stop state.
    risk: R3
    access: write
    result_semantics: ACKNOWLEDGEMENT_ONLY
    idempotent: true
    cancelable: false
    preconditions: [A verified emergency-stop request route exists.]
    postconditions: [Only request acknowledgement is asserted in Adapt.]
    side_effects: [May stop all physical motion immediately.]
    resource_locks: [robot_safety_state]
    error_codes: [UNAVAILABLE, TIMEOUT, INVALID_INPUT, NOT_AUTHORIZED,
      PRECONDITION_FAILED, OPERATION_FAILED]
    input_schema: *no_input
    output_schema:
      type: object
      properties:
        status: {type: string}
        stop_state: {type: string}
      required: [status]
      additionalProperties: false

  - <<: *adapter_defaults
    contract_id: app.safety.protective_stop
    operation: app.safety.protective_stop
    description: Request the target safety controller to enter a protective-stop state.
    risk: R3
    access: write
    result_semantics: ACKNOWLEDGEMENT_ONLY
    idempotent: true
    cancelable: false
    preconditions: [A verified protective-stop request route exists.]
    postconditions: [Only request acknowledgement is asserted in Adapt.]
    side_effects: [May stop physical motion.]
    resource_locks: [robot_safety_state]
    error_codes: [UNAVAILABLE, TIMEOUT, INVALID_INPUT, NOT_AUTHORIZED,
      PRECONDITION_FAILED, OPERATION_FAILED]
    input_schema: *no_input
    output_schema:
      type: object
      properties:
        status: {type: string}
        stop_state: {type: string}
      required: [status]
      additionalProperties: false

  - <<: *adapter_defaults
    contract_id: app.safety.stop.clear
    operation: app.safety.stop.clear
    description: Request clearance of a previously established target safety stop state.
    risk: R3
    access: write
    result_semantics: ACKNOWLEDGEMENT_ONLY
    idempotent: false
    cancelable: false
    preconditions:
      - Explicit safety authorization exists.
      - The cause of the stop has been resolved outside Adapt.
    postconditions: [Only request acknowledgement is asserted in Adapt.]
    side_effects: [May permit subsequent physical motion.]
    resource_locks: [robot_safety_state]
    error_codes: [UNAVAILABLE, TIMEOUT, INVALID_INPUT, NOT_AUTHORIZED,
      PRECONDITION_FAILED, OPERATION_FAILED]
    input_schema: *no_input
    output_schema:
      type: object
      properties:
        status: {type: string}
        stop_state: {type: string}
      required: [status]
      additionalProperties: false

  - <<: *adapter_defaults
    contract_id: app.robot.status
    operation: app.robot.status
    description: Read the target robot application lifecycle state without changing it.
    risk: R0
    access: read
    idempotent: true
    cancelable: false
    capability_requirements: [robot application status route]
    input_schema: *no_input
    output_schema: *observed_status_output
    retry_policy: bounded_exponential_backoff

  - <<: *adapter_defaults
    contract_id: app.camera.stream.start
    operation: app.camera.stream.start
    data_classification: SENSITIVE
    description: Start a bounded camera stream session with explicit lifetime and byte limits.
    result_semantics: SESSION_HANDLE
    execution_mode: SESSION_START
    paired_operation: app.camera.stream.stop
    risk: R1
    access: write
    idempotent: false
    cancelable: false
    max_duration_s: 10
    capability_requirements: [camera streaming route with bounded session controls]
    postconditions: [A session handle and expiry are acknowledged; frame quality is not asserted.]
    side_effects:
      - Opens a camera stream and consumes camera, compute, and storage resources.
    resource_locks: [camera_stream]
    rate_limit: one active session per camera
    input_schema:
      type: object
      properties:
        camera: {type: string, minLength: 1}
        ttl_s: {type: number, minimum: 1, maximum: 300}
        max_bytes: {type: integer, minimum: 1024, maximum: 100000000}
      required: [camera, ttl_s, max_bytes]
      additionalProperties: false
    output_schema:
      type: object
      properties:
        status: {type: string}
        session_id: {type: string}
        expires_at: {type: string}
        stream_ref: {type: string}
      required: [status, session_id, expires_at]
      additionalProperties: false

  - <<: *adapter_defaults
    contract_id: app.camera.stream.stop
    operation: app.camera.stream.stop
    data_classification: SENSITIVE
    description: Stop one camera stream session identified by its opaque session handle.
    execution_mode: SESSION_STOP
    paired_operation: app.camera.stream.start
    result_semantics: ACKNOWLEDGEMENT_ONLY
    risk: R1
    access: write
    idempotent: true
    cancelable: false
    max_duration_s: 10
    capability_requirements: [camera streaming route with bounded session controls]
    postconditions: [Session-stop acknowledgement is returned; resource release is not asserted.]
    side_effects: [Requests closure of an active camera stream.]
    resource_locks: [camera_stream]
    rate_limit: one stop request per session at a time
    input_schema:
      type: object
      properties: {session_id: {type: string, minLength: 1}}
      required: [session_id]
      additionalProperties: false
    output_schema:
      type: object
      properties:
        status: {type: string}
        session_id: {type: string}
      required: [status, session_id]
      additionalProperties: false

  - <<: *adapter_defaults
    contract_id: app.robot.health
    operation: app.robot.health
    description: Read the aggregated application health and bounded supporting details.
    risk: R0
    access: read
    idempotent: true
    cancelable: false
    capability_requirements: [robot application health route]
    input_schema: *no_input
    output_schema: *observed_status_output
    retry_policy: bounded_exponential_backoff

  - <<: *adapter_defaults
    contract_id: app.camera.list
    operation: app.camera.list
    description: List application-visible cameras with stable identity and frame metadata.
    risk: R0
    access: read
    idempotent: true
    cancelable: false
    capability_requirements: [camera inventory route]
    input_schema: *no_input
    output_schema: *collection_output

  - <<: *adapter_defaults
    contract_id: app.camera.status
    operation: app.camera.status
    description: Read stream availability and health for one application-visible camera.
    risk: R0
    access: read
    idempotent: true
    cancelable: false
    capability_requirements: [camera status route]
    input_schema: *selector_input
    output_schema: *observed_status_output

  - <<: *adapter_defaults
    contract_id: app.camera.inspect
    operation: app.camera.inspect
    description: Inspect identity, frame, format, and bounded metadata for one camera.
    risk: R0
    access: read
    idempotent: true
    cancelable: false
    capability_requirements: [camera metadata route]
    input_schema: *selector_input
    output_schema: *detail_output

  - <<: *adapter_defaults
    contract_id: app.camera.calibration.status
    operation: app.camera.calibration.status
    description: Read calibration availability, identity, and age for one camera.
    risk: R0
    access: read
    idempotent: true
    cancelable: false
    capability_requirements: [camera calibration status route]
    input_schema: *selector_input
    output_schema: *observed_status_output

  - <<: *adapter_defaults
    contract_id: app.lidar.list
    operation: app.lidar.list
    description: List application-visible lidars with stable identity and frame metadata.
    risk: R0
    access: read
    idempotent: true
    cancelable: false
    capability_requirements: [lidar inventory route]
    input_schema: *no_input
    output_schema: *collection_output

  - <<: *adapter_defaults
    contract_id: app.lidar.status
    operation: app.lidar.status
    description: Read stream availability and health for one application-visible lidar.
    risk: R0
    access: read
    idempotent: true
    cancelable: false
    capability_requirements: [lidar status route]
    input_schema: *selector_input
    output_schema: *observed_status_output

  - <<: *adapter_defaults
    contract_id: app.lidar.inspect
    operation: app.lidar.inspect
    description: Inspect identity, frame, scan geometry, and bounded metadata for one lidar.
    risk: R0
    access: read
    idempotent: true
    cancelable: false
    capability_requirements: [lidar metadata route]
    input_schema: *selector_input
    output_schema: *detail_output

  - <<: *adapter_defaults
    contract_id: app.lidar.calibration.status
    operation: app.lidar.calibration.status
    description: Read calibration availability, identity, and age for one lidar.
    risk: R0
    access: read
    idempotent: true
    cancelable: false
    capability_requirements: [lidar calibration status route]
    input_schema: *selector_input
    output_schema: *observed_status_output

  - <<: *adapter_defaults
    contract_id: app.imu.list
    operation: app.imu.list
    description: List application-visible inertial units with stable identity and frame metadata.
    risk: R0
    access: read
    idempotent: true
    cancelable: false
    capability_requirements: [IMU inventory route]
    input_schema: *no_input
    output_schema: *collection_output

  - <<: *adapter_defaults
    contract_id: app.imu.status
    operation: app.imu.status
    description: Read stream availability and health for one inertial measurement unit.
    risk: R0
    access: read
    idempotent: true
    cancelable: false
    capability_requirements: [IMU status route]
    input_schema: *selector_input
    output_schema: *observed_status_output

  - <<: *adapter_defaults
    contract_id: app.imu.inspect
    operation: app.imu.inspect
    description: Inspect identity, frame, ranges, and bounded metadata for one inertial unit.
    risk: R0
    access: read
    idempotent: true
    cancelable: false
    capability_requirements: [IMU metadata route]
    input_schema: *selector_input
    output_schema: *detail_output

  - <<: *adapter_defaults
    contract_id: app.imu.calibration.status
    operation: app.imu.calibration.status
    description: Read calibration availability, identity, and age for one inertial unit.
    risk: R0
    access: read
    idempotent: true
    cancelable: false
    capability_requirements: [IMU calibration status route]
    input_schema: *selector_input
    output_schema: *observed_status_output

  - <<: *adapter_defaults
    contract_id: app.gnss.list
    operation: app.gnss.list
    description: List application-visible GNSS receivers with stable identity metadata.
    risk: R0
    access: read
    idempotent: true
    cancelable: false
    capability_requirements: [GNSS inventory route]
    input_schema: *no_input
    output_schema: *collection_output

  - <<: *adapter_defaults
    contract_id: app.gnss.status
    operation: app.gnss.status
    description: Read fix availability and receiver health without returning a position sample.
    risk: R0
    access: read
    idempotent: true
    cancelable: false
    capability_requirements: [GNSS status route]
    input_schema: *selector_input
    output_schema: *observed_status_output

  - <<: *adapter_defaults
    contract_id: app.gnss.inspect
    operation: app.gnss.inspect
    description: Inspect identity, supported constellations, and metadata for one GNSS receiver.
    risk: R0
    access: read
    idempotent: true
    cancelable: false
    capability_requirements: [GNSS metadata route]
    input_schema: *selector_input
    output_schema: *detail_output

  - <<: *adapter_defaults
    contract_id: app.odometry.status
    operation: app.odometry.status
    description: Read odometry stream availability, frames, and bounded quality metadata.
    risk: R0
    access: read
    idempotent: true
    cancelable: false
    capability_requirements: [odometry status route]
    coordinate_frames: [odom, base_link]
    input_schema: *no_input
    output_schema: *observed_status_output

  - <<: *adapter_defaults
    contract_id: app.base.status
    operation: app.base.status
    description: Read mobile-base readiness, control mode, and bounded health metadata.
    risk: R0
    access: read
    idempotent: true
    cancelable: false
    capability_requirements: [mobile base status route]
    input_schema: *no_input
    output_schema: *observed_status_output

  - <<: *adapter_defaults
    contract_id: app.manipulation.status
    operation: app.manipulation.status
    description: Read manipulator readiness, control mode, and bounded health metadata.
    risk: R0
    access: read
    idempotent: true
    cancelable: false
    capability_requirements: [manipulator status route]
    input_schema: *no_input
    output_schema: *observed_status_output

  - <<: *adapter_defaults
    contract_id: app.gripper.status
    operation: app.gripper.status
    description: Read gripper readiness, opening state, and bounded health metadata.
    risk: R0
    access: read
    idempotent: true
    cancelable: false
    capability_requirements: [gripper status route]
    input_schema: *no_input
    output_schema: *observed_status_output

  - <<: *adapter_defaults
    contract_id: app.localization.pose
    operation: app.localization.pose
    data_classification: SENSITIVE
    description: Read one timestamped robot pose in the declared localization frame.
    risk: R0
    access: read
    idempotent: true
    cancelable: false
    capability_requirements: [localization pose route]
    coordinate_frames: [map, base_link]
    semantic_units:
      x_m: m
      y_m: m
      z_m: m
      orientation_x: quaternion
      orientation_y: quaternion
      orientation_z: quaternion
      orientation_w: quaternion
    input_schema: *no_input
    output_schema:
      type: object
      properties:
        status: {type: string}
        frame_id: {type: string}
        child_frame_id: {type: string}
        x_m: {type: number}
        y_m: {type: number}
        z_m: {type: number}
        orientation_x: {type: number}
        orientation_y: {type: number}
        orientation_z: {type: number}
        orientation_w: {type: number}
        timestamp: {type: string}
        observed_at: {type: string}
      required: [status, frame_id, x_m, y_m, orientation_x, orientation_y, orientation_z,
        orientation_w, timestamp, observed_at]
      additionalProperties: false

  - <<: *adapter_defaults
    contract_id: app.localization.quality
    operation: app.localization.quality
    description: Read normalized localization quality and the frame to which it applies.
    risk: R0
    access: read
    idempotent: true
    cancelable: false
    capability_requirements: [localization quality route]
    input_schema: *no_input
    output_schema:
      type: object
      properties:
        status: {type: string}
        quality: {type: number, minimum: 0, maximum: 1}
        frame_id: {type: string}
        observed_at: {type: string}
      required: [status, quality, observed_at]
      additionalProperties: false

  - <<: *adapter_defaults
    contract_id: app.map.list
    operation: app.map.list
    data_classification: SENSITIVE
    description: List bounded identifiers and metadata for maps visible to the application.
    risk: R0
    access: read
    idempotent: true
    cancelable: false
    capability_requirements: [map inventory route]
    input_schema: *no_input
