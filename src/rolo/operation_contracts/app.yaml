    max_duration_s: 60
    capability_requirements: [navigation planning route without execution]
    semantic_units: {x_m: m, y_m: m, yaw_rad: rad}
    coordinate_frames: [map, odom]
    postconditions: [A plan observation is returned; navigation execution is not started.]
    side_effects: [Consumes planner resources and may create a bounded plan artifact.]
    rate_limit: one navigation planning request per robot at a time
    input_schema:
      type: object
      properties:
        start:
          type: object
          properties:
            frame_id: {type: string}
