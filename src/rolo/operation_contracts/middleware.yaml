schema_version: robot-operation-contract-set/v1

contracts:
  - schema_version: robot-operation-contract/v1
    contract_id: middleware.inspect
    version: 1.0.0
    lifecycle: RELEASED
    operation: middleware.inspect
    layer: middleware
    description: Identify available middleware control planes from bounded host evidence.
    risk: R0
    access: read
    idempotent: true
    cancelable: false
    max_duration_s: 10
    canonical_cli: [robotctl, middleware, inspect]
    input_schema:
      type: object
      properties: {}
      additionalProperties: false
    output_schema:
      type: object
      properties:
        schema_version: {type: string}
        operation: {type: string, enum: [middleware.inspect]}
        status: {type: string}
        observed_at: {type: string}
        data:
          type: object
          properties: {}
          additionalProperties: true
        evidence:
          type: array
          items:
            type: object
            properties: {}
            additionalProperties: true
        warnings: {type: array, items: {type: string}}
      required: [schema_version, operation, status, observed_at, data, evidence, warnings]
      additionalProperties: false
    error_codes: [UNAVAILABLE, TIMEOUT, PROBE_FAILED]
    retry_policy: bounded_exponential_backoff
