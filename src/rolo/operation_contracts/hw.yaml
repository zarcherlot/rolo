schema_version: robot-operation-contract-set/v1

no_input: &no_input
  type: object
  properties: {}
  additionalProperties: false

selector_input: &selector_input
  type: object
  properties: {id: {type: string, minLength: 1}}
  required: [id]
  additionalProperties: false

inventory_item: &inventory_item
  type: object
  properties:
    id: {type: string}
    name: {type: string}
    vendor: {type: string}
    model: {type: string}
    serial: {type: string}
    health: {type: string}
  required: [id]
  additionalProperties: true

collection_output: &collection_output
  type: object
  properties:
    status: {type: string}
    items: {type: array, items: *inventory_item}
    observed_at: {type: string}
  required: [status, items, observed_at]
  additionalProperties: false

detail_output: &detail_output
  type: object
  properties:
    status: {type: string}
    item: *inventory_item
    observed_at: {type: string}
  required: [status, item, observed_at]
  additionalProperties: false

measurement: &measurement
  type: object
  properties:
    name: {type: string}
    value: {type: number}
    unit: {type: string}
    timestamp: {type: string}
  required: [name, value, unit]
  additionalProperties: false

metrics_output: &metrics_output
  type: object
  properties:
    status: {type: string}
    id: {type: string}
    health: {type: string}
    metrics: {type: array, items: *measurement}
    observed_at: {type: string}
  required: [status, metrics, observed_at]
  additionalProperties: false

adapter_defaults: &adapter_defaults
  schema_version: robot-operation-contract/v1
  version: 1.1.0
  lifecycle: GATEABLE
  layer: hw
  data_classification: INTERNAL
  risk: R0
  access: read
  idempotent: true
  cancelable: false
  max_duration_s: 15
  canonical_cli:
    [robotctl, tool, invoke, "{operation}", --robot, "{robot_id}", --input, "{input_json}"]
  error_codes: [UNAVAILABLE, TIMEOUT, INVALID_INPUT, OPERATION_FAILED]
  retry_policy: bounded_exponential_backoff

hardware_ack_output: &hardware_ack_output
  type: object
  properties:
    status: {type: string}
    resource_id: {type: string}
    change_id: {type: string}
    observed_at: {type: string}
  required: [status, resource_id, change_id, observed_at]
  additionalProperties: false

firmware_ack_output: &firmware_ack_output
  type: object
  properties:
    status: {type: string}
    resource_id: {type: string}
    change_id: {type: string}
    rollback_token: {type: string}
    observed_at: {type: string}
  required: [status, resource_id, change_id, rollback_token, observed_at]
  additionalProperties: false

hardware_r2_mutation: &hardware_r2_mutation
  <<: *adapter_defaults
  data_classification: SENSITIVE
  risk: R2
  access: write
  idempotent: false
  cancelable: false
  result_semantics: ACKNOWLEDGEMENT_ONLY
  max_duration_s: 30
  output_schema: *hardware_ack_output
  capability_requirements:
    [target-bound hardware mutation route, protected OS write policy and exact operation allowlist]
  postconditions:
    [The response acknowledges mutation acceptance only; resulting hardware state must be observed separately.]
  error_codes:
    [UNAVAILABLE, NOT_AUTHORIZED, INVALID_TARGET, INVALID_INPUT, PRECONDITION_FAILED, CONFLICT,
      TIMEOUT, OPERATION_FAILED]
  retry_policy: none

hardware_r3_mutation: &hardware_r3_mutation
  <<: *hardware_r2_mutation
  risk: R3
  requires_quiescence: false
  capability_requirements:
    [external R3 authorization provider, target-bound actuator or power-control route,
      active physical interlock and watchdog route]
  preconditions:
    [External R3 authorization and target physical interlocks are active.]
  postconditions:
    [The response acknowledges command acceptance only; physical state must be observed separately.]
  side_effects: [May directly change actuator state or robot physical stability.]
  resource_locks: [target physical hardware resource]
  error_codes:
    [UNAVAILABLE, NOT_AUTHORIZED, INVALID_TARGET, INVALID_INPUT, INTERLOCK_BLOCKED, BUSY,
      PRECONDITION_FAILED, TIMEOUT, OPERATION_FAILED]
  retry_policy: none

contracts:
  - schema_version: robot-operation-contract/v1
    contract_id: hw.inventory.scan
    version: 1.1.0
    lifecycle: RELEASED
    operation: hw.inventory.scan
    layer: hw
    data_classification: INTERNAL
    description: Perform bounded read-only inventory of compute, buses, and attached hardware.
    risk: R0
    access: read
    idempotent: true
    cancelable: false
    max_duration_s: 30
    canonical_cli: [robotctl, hw, inventory, scan]
    input_schema:
      type: object
      properties: {}
      additionalProperties: false
    output_schema:
      type: object
      properties:
        layer: {type: string, enum: [hw]}
        status: {type: string}
        data:
          type: object
          properties: {}
          additionalProperties: true
        warnings: {type: array, items: {type: string}}
        errors: {type: array, items: {type: string}}
        observed_at: {type: string}
      required: [layer, status, data, warnings, errors, observed_at]
      additionalProperties: false
    error_codes: [UNAVAILABLE, TIMEOUT, PROBE_FAILED]
    retry_policy: bounded_exponential_backoff

  - <<: *adapter_defaults
    contract_id: hw.compute.list
    operation: hw.compute.list
    description: List compute modules with stable identity and declared health metadata.
    capability_requirements: [compute inventory route]
    input_schema: *no_input
    output_schema: *collection_output

  - <<: *adapter_defaults
    contract_id: hw.compute.inspect
    operation: hw.compute.inspect
    description: Inspect identity, model, and bounded metadata for one compute module.
    capability_requirements: [compute inventory route]
    input_schema: *selector_input
    output_schema: *detail_output

  - <<: *adapter_defaults
    contract_id: hw.compute.status
    operation: hw.compute.status
    description: Read health and numeric resource metrics for one compute module.
    capability_requirements: [compute health route]
    input_schema: *selector_input
    output_schema: *metrics_output

  - <<: *adapter_defaults
    contract_id: hw.clock.status
    operation: hw.clock.status
    description: Read hardware clock source, offset, and synchronization metrics.
    capability_requirements: [hardware clock status route]
    input_schema: *no_input
    output_schema: *metrics_output

  - <<: *adapter_defaults
    contract_id: hw.thermal.status
    operation: hw.thermal.status
    description: Read bounded temperatures, limits, and thermal health metrics.
    capability_requirements: [thermal telemetry route]
    input_schema: *no_input
    output_schema: *metrics_output

  - <<: *adapter_defaults
    contract_id: hw.storage.status
    operation: hw.storage.status
    description: Read bounded capacity, wear, and health metrics for attached storage.
    capability_requirements: [storage telemetry route]
    input_schema: *no_input
    output_schema: *metrics_output

  - <<: *adapter_defaults
    contract_id: hw.sensor.list
    operation: hw.sensor.list
    description: List sensors with stable identity, model, and declared health metadata.
    capability_requirements: [sensor inventory route]
    input_schema: *no_input
    output_schema: *collection_output

  - <<: *adapter_defaults
    contract_id: hw.sensor.inspect
    operation: hw.sensor.inspect
    description: Inspect identity, model, channels, and bounded metadata for one sensor.
    capability_requirements: [sensor inventory route]
    input_schema: *selector_input
    output_schema: *detail_output

  - <<: *adapter_defaults
    contract_id: hw.sensor.status
    operation: hw.sensor.status
    description: Read health and bounded diagnostic metrics for one sensor.
    capability_requirements: [sensor health route]
    input_schema: *selector_input
    output_schema: *metrics_output

  - <<: *adapter_defaults
    contract_id: hw.sensor.read
    operation: hw.sensor.read
    data_classification: SENSITIVE
    description: Read one bounded numeric sample set from an explicit sensor.
    capability_requirements: [bounded sensor read route]
    time_semantics: Each sample timestamp identifies its observation time when available.
    input_schema: *selector_input
    output_schema: *metrics_output

  - <<: *adapter_defaults
    contract_id: hw.actuator.list
    operation: hw.actuator.list
    description: List actuators with stable identity, model, and declared health metadata.
    capability_requirements: [actuator inventory route]
    input_schema: *no_input
    output_schema: *collection_output

  - <<: *adapter_defaults
    contract_id: hw.actuator.inspect
    operation: hw.actuator.inspect
    description: Inspect identity, model, limits, and bounded metadata for one actuator.
    capability_requirements: [actuator inventory route]
    input_schema: *selector_input
    output_schema: *detail_output

  - <<: *adapter_defaults
    contract_id: hw.actuator.status
    operation: hw.actuator.status
    description: Read health and bounded diagnostic metrics for one actuator.
    capability_requirements: [actuator health route]
    input_schema: *selector_input
    output_schema: *metrics_output

  - <<: *adapter_defaults
    contract_id: hw.bus.list
    operation: hw.bus.list
    description: List hardware buses with stable identity, type, and declared health metadata.
    capability_requirements: [hardware bus inventory route]
    input_schema: *no_input
    output_schema: *collection_output

  - <<: *adapter_defaults
    contract_id: hw.bus.inspect
    operation: hw.bus.inspect
    description: Inspect identity, type, topology, and bounded metadata for one hardware bus.
    capability_requirements: [hardware bus inventory route]
    input_schema: *selector_input
    output_schema: *detail_output

  - <<: *adapter_defaults
    contract_id: hw.bus.status
    operation: hw.bus.status
    description: Read health and bounded diagnostic metrics for one hardware bus.
    capability_requirements: [hardware bus health route]
    input_schema: *selector_input
    output_schema: *metrics_output

  - <<: *adapter_defaults
    contract_id: hw.bus.statistics
    operation: hw.bus.statistics
    description: Read bounded traffic and error counters for one hardware bus.
    capability_requirements: [hardware bus statistics route]
    input_schema: *selector_input
    output_schema: *metrics_output

  - <<: *adapter_defaults
    contract_id: hw.bus.scan
    operation: hw.bus.scan
    description: Perform one bounded discovery scan on an explicit hardware bus.
    risk: R1
    observation_overhead: ELEVATED
    capability_requirements: [bounded hardware bus discovery route]
    side_effects: [Generates bounded probe traffic on the selected hardware bus.]
    resource_locks: [hardware_bus_scan]
    rate_limit: one scan per bus per 30 seconds
    input_schema: *selector_input
    output_schema: *collection_output

  - <<: *adapter_defaults
    contract_id: hw.firmware.list
    operation: hw.firmware.list
    description: List firmware-bearing components and their reported versions.
    capability_requirements: [firmware inventory route]
    input_schema: *no_input
    output_schema: *collection_output

  - <<: *adapter_defaults
    contract_id: hw.firmware.inspect
    operation: hw.firmware.inspect
    description: Inspect version, vendor, and bounded metadata for one firmware component.
    capability_requirements: [firmware inventory route]
    input_schema: *selector_input
    output_schema: *detail_output

  - <<: *adapter_defaults
    contract_id: hw.firmware.verify
    operation: hw.firmware.verify
    description: Verify reported firmware identity or digest without changing the component.
    capability_requirements: [firmware verification route]
    input_schema:
      type: object
      properties:
        id: {type: string, minLength: 1}
        expected_sha256: {type: string, minLength: 64, maxLength: 64}
      required: [id]
      additionalProperties: false
    output_schema:
      type: object
      properties:
        status: {type: string}
        id: {type: string}
        verified: {type: boolean}
        observed_sha256: {type: string}
        observed_at: {type: string}
      required: [status, id, verified, observed_at]
      additionalProperties: false

  - <<: *adapter_defaults
    contract_id: hw.power.status
    operation: hw.power.status
    description: Read overall robot power-source, voltage, current, and health metrics.
    capability_requirements: [power telemetry route]
    input_schema: *no_input
    output_schema: *metrics_output

  - <<: *adapter_defaults
    contract_id: hw.power.battery.status
    operation: hw.power.battery.status
    description: Read bounded battery charge, voltage, current, temperature, and health metrics.
    capability_requirements: [battery telemetry route]
    input_schema: *no_input
    output_schema: *metrics_output

  - <<: *adapter_defaults
    contract_id: hw.power.rail.list
    operation: hw.power.rail.list
    description: List controllable or observable power rails with stable identity metadata.
    capability_requirements: [power rail inventory route]
    input_schema: *no_input
    output_schema: *collection_output

  - <<: *adapter_defaults
    contract_id: hw.power.rail.inspect
    operation: hw.power.rail.inspect
    description: Inspect identity, limits, and bounded metadata for one power rail.
    capability_requirements: [power rail inventory route]
    input_schema: *selector_input
    output_schema: *detail_output

  - <<: *hardware_r2_mutation
    contract_id: hw.sensor.calibrate
    operation: hw.sensor.calibrate
    description: Request one bounded calibration of an explicit sensor under execution quiescence.
    requires_quiescence: true
    capability_requirements:
      [target-bound sensor calibration route, protected OS write policy and exact operation allowlist,
        protected execution supervisor providing a bound quiescence lease]
    preconditions:
      - >-
        resource_id identifies one discovered sensor; calibration_profile_id is compatible with that
        sensor; expected_configuration_sha256 matches and execution quiescence covers the invocation.
    side_effects: [May update volatile or persistent sensor calibration state.]
    resource_locks: [sensor identified by resource_id, robot execution quiescence lease]
    input_schema:
      type: object
      properties:
        resource_id: {type: string, minLength: 1}
        calibration_profile_id: {type: string, minLength: 1}
        expected_configuration_sha256: {type: string, minLength: 64, maxLength: 64}
      required: [resource_id, calibration_profile_id, expected_configuration_sha256]
      additionalProperties: false

  - <<: *hardware_r2_mutation
    contract_id: hw.sensor.reset
    operation: hw.sensor.reset
    description: Request reset of one explicit sensor without resetting its bus or peer devices.
    requires_quiescence: true
    capability_requirements:
      [target-bound sensor reset route, protected OS write policy and exact operation allowlist,
        protected execution supervisor providing a bound quiescence lease]
    preconditions:
      - >-
        resource_id identifies one discovered resettable sensor and execution quiescence covers the
        complete invocation.
    side_effects: [May interrupt sampling and clear volatile sensor state.]
    resource_locks: [sensor identified by resource_id, robot execution quiescence lease]
    input_schema:
      type: object
      properties:
        resource_id: {type: string, minLength: 1}
        reset_profile_id: {type: string, minLength: 1}
      required: [resource_id, reset_profile_id]
      additionalProperties: false

  - <<: *hardware_r3_mutation
    contract_id: hw.actuator.command
    operation: hw.actuator.command
    description: Submit one bounded typed command to an explicit discovered actuator.
    side_effects: [May directly command physical actuator motion or effort.]
    resource_locks: [actuator identified by resource_id]
    input_schema:
      type: object
      properties:
        resource_id: {type: string, minLength: 1}
        mode: {type: string, enum: [position, velocity, effort, duty_cycle]}
        value: {type: number}
        unit: {type: string, minLength: 1}
        duration_s: {type: number, minimum: 0.01, maximum: 5}
        safety_profile_id: {type: string, minLength: 1}
        expected_state_sha256: {type: string, minLength: 64, maxLength: 64}
      required:
        [resource_id, mode, value, unit, duration_s, safety_profile_id, expected_state_sha256]
      additionalProperties: false

  - <<: *hardware_r3_mutation
    contract_id: hw.actuator.stop
    operation: hw.actuator.stop
    description: Request a controlled operational stop of one explicit actuator.
    idempotent: true
    postconditions:
      - >-
        The response acknowledges an operational-stop request only; actuator state must be observed
        separately and no protective-stop or emergency-stop claim is made.
    side_effects:
      - May command controlled deceleration, holding torque or brake engagement.
    resource_locks: [actuator identified by resource_id]
    input_schema:
      type: object
      properties:
        resource_id: {type: string, minLength: 1}
        stop_profile_id: {type: string, minLength: 1}
      required: [resource_id, stop_profile_id]
      additionalProperties: false

  - <<: *hardware_r3_mutation
    contract_id: hw.actuator.enable
    operation: hw.actuator.enable
    description: Request controlled enablement of one explicit actuator power or command stage.
    idempotent: true
    side_effects: [May energize an actuator and permit subsequent physical motion.]
    resource_locks: [actuator identified by resource_id]
    input_schema:
      type: object
      properties:
        resource_id: {type: string, minLength: 1}
        enable_profile_id: {type: string, minLength: 1}
        expected_state_sha256: {type: string, minLength: 64, maxLength: 64}
      required: [resource_id, enable_profile_id, expected_state_sha256]
      additionalProperties: false

  - <<: *hardware_r3_mutation
    contract_id: hw.actuator.disable
    operation: hw.actuator.disable
    description: Request controlled disablement of one explicit actuator power or command stage.
    idempotent: true
    side_effects: [May remove holding effort and change robot physical stability.]
    resource_locks: [actuator identified by resource_id]
    input_schema:
      type: object
      properties:
        resource_id: {type: string, minLength: 1}
        disable_profile_id: {type: string, minLength: 1}
        expected_state_sha256: {type: string, minLength: 64, maxLength: 64}
      required: [resource_id, disable_profile_id, expected_state_sha256]
      additionalProperties: false

  - <<: *hardware_r3_mutation
    contract_id: hw.actuator.calibrate
    operation: hw.actuator.calibrate
    description: Request one bounded target-defined calibration of an explicit actuator.
    cancelable: true
    compensation_operation: hw.actuator.stop
    max_duration_s: 60
    side_effects: [May move the actuator and update persistent calibration state.]
    resource_locks: [actuator identified by resource_id, robot physical execution]
    input_schema:
      type: object
      properties:
        resource_id: {type: string, minLength: 1}
        calibration_profile_id: {type: string, minLength: 1}
        timeout_s: {type: number, minimum: 0.1, maximum: 55}
        expected_state_sha256: {type: string, minLength: 64, maxLength: 64}
      required: [resource_id, calibration_profile_id, timeout_s, expected_state_sha256]
      additionalProperties: false

  - <<: *hardware_r3_mutation
    contract_id: hw.actuator.reset
    operation: hw.actuator.reset
    description: Request a bounded reset of one explicit actuator controller.
    side_effects:
      - May interrupt control, clear faults and change actuator holding state.
    resource_locks: [actuator identified by resource_id, robot physical execution]
    input_schema:
      type: object
      properties:
        resource_id: {type: string, minLength: 1}
        reset_profile_id: {type: string, minLength: 1}
        expected_state_sha256: {type: string, minLength: 64, maxLength: 64}
      required: [resource_id, reset_profile_id, expected_state_sha256]
      additionalProperties: false

  - <<: *hardware_r2_mutation
    contract_id: hw.bus.reset
    operation: hw.bus.reset
    description: Request a bounded reset of one explicit hardware bus under execution quiescence.
    requires_quiescence: true
    capability_requirements:
      [target-bound hardware bus reset route, protected OS write policy and exact operation allowlist,
        protected execution supervisor providing a bound quiescence lease]
    preconditions:
      - >-
        resource_id identifies one discovered resettable bus and execution quiescence covers the
        complete invocation.
    side_effects: [May interrupt communication with every device attached to the selected bus.]
    resource_locks: [hardware bus identified by resource_id, robot execution quiescence lease]
    input_schema:
      type: object
      properties:
        resource_id: {type: string, minLength: 1}
        reset_profile_id: {type: string, minLength: 1}
      required: [resource_id, reset_profile_id]
      additionalProperties: false

  - <<: *hardware_r2_mutation
    contract_id: hw.firmware.update
    operation: hw.firmware.update
    description: Request firmware installation from a signed digest-pinned protected artifact.
    requires_quiescence: true
    max_duration_s: 110
    output_schema: *firmware_ack_output
    capability_requirements:
      [protected firmware artifact resolver with SHA-256 and signature verification,
        target compatibility-manifest verifier, power-stability monitor,
        protected execution supervisor providing a bound quiescence lease]
    preconditions:
      - >-
        resource_id identifies one discovered firmware target; artifact digest, signature,
        compatibility manifest and expected current firmware digest match; stable power and execution
        quiescence cover the complete invocation.
    postconditions:
      - >-
        The response acknowledges installation acceptance and returns an opaque rollback token;
        firmware identity and device health must be observed separately.
    side_effects: [May replace firmware and temporarily make the target device unavailable.]
    resource_locks: [firmware target identified by resource_id, robot execution quiescence lease]
    input_schema:
      type: object
      properties:
        resource_id: {type: string, minLength: 1}
        artifact_ref: {type: string, minLength: 12}
        artifact_sha256: {type: string, minLength: 64, maxLength: 64}
        signature_ref: {type: string, minLength: 12}
        signature_sha256: {type: string, minLength: 64, maxLength: 64}
        compatibility_manifest_sha256: {type: string, minLength: 64, maxLength: 64}
        expected_current_sha256: {type: string, minLength: 64, maxLength: 64}
        max_bytes: {type: integer, minimum: 1, maximum: 1000000000}
      required:
        [resource_id, artifact_ref, artifact_sha256, signature_ref, signature_sha256,
          compatibility_manifest_sha256, expected_current_sha256, max_bytes]
      additionalProperties: false

  - <<: *hardware_r2_mutation
    contract_id: hw.firmware.rollback
    operation: hw.firmware.rollback
    description: Request rollback to a previously saved firmware image under execution quiescence.
    requires_quiescence: true
    max_duration_s: 110
    capability_requirements:
      [target-bound firmware rollback route, power-stability monitor,
        protected execution supervisor providing a bound quiescence lease]
    preconditions:
      - >-
        rollback_token belongs to resource_id; expected_current_sha256 matches; stable power and
        execution quiescence cover the complete invocation.
    postconditions:
      - >-
        The response acknowledges rollback acceptance only; firmware identity and health must be
        observed separately.
    side_effects: [May replace firmware and temporarily make the target device unavailable.]
    resource_locks: [firmware target identified by resource_id, robot execution quiescence lease]
    input_schema:
      type: object
      properties:
        resource_id: {type: string, minLength: 1}
        rollback_token: {type: string, minLength: 12}
        expected_current_sha256: {type: string, minLength: 64, maxLength: 64}
      required: [resource_id, rollback_token, expected_current_sha256]
      additionalProperties: false

  - <<: *hardware_r3_mutation
    contract_id: hw.power.rail.enable
    operation: hw.power.rail.enable
    description: Request controlled energization of one explicit power rail.
    idempotent: true
    side_effects: [May energize attached actuators or other physical hardware.]
    resource_locks: [power rail identified by resource_id, robot physical execution]
    input_schema:
      type: object
      properties:
        resource_id: {type: string, minLength: 1}
        power_profile_id: {type: string, minLength: 1}
        expected_state_sha256: {type: string, minLength: 64, maxLength: 64}
      required: [resource_id, power_profile_id, expected_state_sha256]
      additionalProperties: false

  - <<: *hardware_r3_mutation
    contract_id: hw.power.rail.disable
    operation: hw.power.rail.disable
    description: Request controlled de-energization of one explicit power rail.
    idempotent: true
    side_effects: [May disable attached actuators and change robot physical stability.]
    resource_locks: [power rail identified by resource_id, robot physical execution]
    input_schema:
      type: object
      properties:
        resource_id: {type: string, minLength: 1}
        power_profile_id: {type: string, minLength: 1}
        expected_state_sha256: {type: string, minLength: 64, maxLength: 64}
      required: [resource_id, power_profile_id, expected_state_sha256]
      additionalProperties: false

  - <<: *hardware_r3_mutation
    contract_id: hw.power.cycle
    operation: hw.power.cycle
    description: Request one bounded off-on power cycle of an explicit power domain.
    side_effects:
      - May interrupt and re-energize actuators, sensors and compute devices.
    resource_locks: [power domain identified by resource_id, robot physical execution]
    input_schema:
      type: object
      properties:
        resource_id: {type: string, minLength: 1}
        power_profile_id: {type: string, minLength: 1}
        off_duration_s: {type: number, minimum: 0.1, maximum: 10}
        expected_state_sha256: {type: string, minLength: 64, maxLength: 64}
      required: [resource_id, power_profile_id, off_duration_s, expected_state_sha256]
      additionalProperties: false
