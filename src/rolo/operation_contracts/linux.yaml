    data_classification: SENSITIVE
    description: Request rollback of one configuration target using its system-issued opaque token.
    preconditions:
      [target_resource_id resolves to the token-bound configuration target,
        rollback_token was issued by the gated adapter and has not been consumed or expired]
    postconditions:
      [The response acknowledges rollback acceptance only; resulting configuration state must be
        observed separately.]
    side_effects: [May restore persistent target configuration and trigger target-specific reload behavior.]
    resource_locks: [configuration target identified by target_resource_id]
    capability_requirements:
      [protected OS write policy and exact operation allowlist, gated adapter binding,
        protected rollback token store]
    error_codes:
      [UNAVAILABLE, NOT_AUTHORIZED, INVALID_TARGET, INVALID_ROLLBACK_TOKEN, TOKEN_EXPIRED,
        PRECONDITION_FAILED, TIMEOUT, OPERATION_FAILED]
    input_schema:
      type: object
      properties:
        target_resource_id: {type: string, minLength: 1}
        rollback_token: {type: string, minLength: 12}
      required: [target_resource_id, rollback_token]
      additionalProperties: false
