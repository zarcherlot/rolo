  - <<: *write_defaults
    contract_id: linux.config.apply
    operation: linux.config.apply
    data_classification: SENSITIVE
    description: Apply one digest-pinned configuration artifact to a discovered target resource.
    preconditions:
      [target_resource_id resolves to a discovered configuration target,
        artifact_ref resolves inside the protected artifact root and matches artifact_sha256]
    postconditions:
      [The response acknowledges apply acceptance and returns a non-authorizing rollback token;
        resulting configuration state must be observed separately.]
    side_effects: [May replace persistent target configuration and trigger target-specific reload behavior.]
    resource_locks: [configuration target identified by target_resource_id]
    compensation_operation: linux.config.rollback
    capability_requirements:
      [protected OS write policy and exact operation allowlist, gated adapter binding,
        protected artifact resolver with SHA-256 verification, protected rollback token store]
    error_codes:
      [UNAVAILABLE, NOT_AUTHORIZED, INVALID_TARGET, INVALID_ARTIFACT, DIGEST_MISMATCH,
        PRECONDITION_FAILED, TIMEOUT, OPERATION_FAILED]
    input_schema:
      type: object
      properties:
        target_resource_id: {type: string, minLength: 1}
        artifact_ref: {type: string, minLength: 12}
        artifact_sha256: {type: string, minLength: 64, maxLength: 64}
        format: {type: string, enum: [auto, json, yaml, toml]}
        max_bytes: {type: integer, minimum: 1, maximum: 100000000}
      required: [target_resource_id, artifact_ref, artifact_sha256, format, max_bytes]
      additionalProperties: false
    output_schema: *config_apply_output

  - <<: *write_defaults
    contract_id: linux.config.rollback
