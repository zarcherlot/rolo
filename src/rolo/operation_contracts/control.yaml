schema_version: robot-operation-contract-set/v1

defaults: &defaults
  schema_version: robot-operation-contract/v1
  version: 1.1.0
  lifecycle: RELEASED
  layer: control
  data_classification: INTERNAL
  risk: R0
  access: read
  idempotent: true
  cancelable: false
  max_duration_s: 5
  error_codes: [UNAVAILABLE, TIMEOUT, CONTRACT_MISMATCH]
  retry_policy: bounded_exponential_backoff

gateable_read_defaults: &gateable_read_defaults
  schema_version: robot-operation-contract/v1
  version: 1.1.0
  lifecycle: GATEABLE
  layer: control
  data_classification: SENSITIVE
  risk: R0
  access: read
  idempotent: true
  cancelable: false
  max_duration_s: 10
  canonical_cli:
    [robotctl, tool, invoke, "{operation}", --robot, "{robot_id}", --input, "{input_json}"]
  error_codes: [UNAVAILABLE, NOT_AUTHORIZED, INVALID_INPUT, TIMEOUT, OPERATION_FAILED]
  retry_policy: bounded_exponential_backoff

gateable_mutation_defaults: &gateable_mutation_defaults
  schema_version: robot-operation-contract/v1
  version: 1.1.0
  lifecycle: GATEABLE
  layer: control
  data_classification: SENSITIVE
  risk: R2
  access: write
  idempotent: false
  cancelable: false
  result_semantics: ACKNOWLEDGEMENT_ONLY
  max_duration_s: 30
  canonical_cli:
    [robotctl, tool, invoke, "{operation}", --robot, "{robot_id}", --input, "{input_json}"]
  error_codes:
    [UNAVAILABLE, NOT_AUTHORIZED, INVALID_TARGET, PRECONDITION_FAILED, CONFLICT, TIMEOUT,
      OPERATION_FAILED]
  postconditions:
    [The response acknowledges the control-plane request only; resulting state must be observed
      separately.]
  retry_policy: none

contracts:
  - <<: *defaults
    contract_id: tool.catalog
    operation: tool.catalog
    description: Read the active gated Tool Catalog for one robot identity.
    canonical_cli: [robotctl, tool, catalog, --robot, "{robot_id}"]
    input_schema:
      type: object
      properties: {}
      additionalProperties: false
    output_schema:
      type: object
      properties:
        schema_version: {type: string}
        robot_id: {type: string}
        discovery_id: {type: string}
        contract_catalog_sha256: {type: string}
        tools:
          type: array
          items:
            type: object
            properties: {}
            additionalProperties: true
      required:
        [schema_version, robot_id, discovery_id, contract_catalog_sha256, tools]
      additionalProperties: false

  - <<: *defaults
    contract_id: tool.schema
    operation: tool.schema
    description: Read the active input and output contract for one canonical operation.
    canonical_cli: [robotctl, tool, schema, "{operation}", --robot, "{robot_id}"]
    input_schema:
      type: object
      properties:
        operation: {type: string, minLength: 1}
      required: [operation]
      additionalProperties: false
    output_schema:
      type: object
      properties:
        operation: {type: string}
        input_schema:
          type: object
          properties: {}
          additionalProperties: true
        output_schema:
          type: object
          properties: {}
          additionalProperties: true
        availability: {type: string}
      required: [operation, input_schema, output_schema, availability]
      additionalProperties: false

  - <<: *defaults
    contract_id: runtime.health
    operation: runtime.health
    description: Read local Rolo runtime readiness, version, and registered robot count.
    canonical_cli: [robotctl, runtime, health]
    input_schema:
      type: object
      properties: {}
      additionalProperties: false
    output_schema:
      type: object
      properties:
        status: {type: string}
        version: {type: string}
        registered_robots: {type: integer, minimum: 0}
        artifact_root: {type: string}
        error: {type: string}
      required: [status, version]
      additionalProperties: false

  - <<: *defaults
    contract_id: runtime.version
    operation: runtime.version
    description: Read installed Rolo and supported contract protocol versions.
    data_classification: PUBLIC
    canonical_cli: [robotctl, runtime, version]
    input_schema:
      type: object
      properties: {}
      additionalProperties: false
    output_schema:
      type: object
      properties:
        status: {type: string}
        version: {type: string}
        operation_contract_schema: {type: string}
        adapter_protocol: {type: string}
        tool_catalog_schema: {type: string}
      required:
        [status, version, operation_contract_schema, adapter_protocol, tool_catalog_schema]
      additionalProperties: false

  - <<: *defaults
    contract_id: state.graph.snapshot
    operation: state.graph.snapshot
    description: Read the State Graph from one robot's active gated adapter release.
    canonical_cli: [robotctl, state, graph, snapshot, --robot, "{robot_id}"]
    input_schema:
      type: object
      properties: {}
      additionalProperties: false
    output_schema:
      type: object
      properties:
        schema_version: {type: string}
        robot_id: {type: string}
        discovery_id: {type: string}
        nodes:
          type: array
          items: {type: object, properties: {}, additionalProperties: true}
        edges:
          type: array
          items: {type: object, properties: {}, additionalProperties: true}
      required: [schema_version, robot_id, discovery_id, nodes, edges]
      additionalProperties: false

  - <<: *defaults
    contract_id: state.graph.query
    operation: state.graph.query
    description: Search active State Graph nodes and edges with one bounded text term.
    canonical_cli: [robotctl, state, graph, query, "{query}", --robot, "{robot_id}"]
    input_schema:
      type: object
      properties: {query: {type: string, minLength: 1}}
      required: [query]
      additionalProperties: false
    output_schema:
      type: object
      properties:
        schema_version: {type: string}
        robot_id: {type: string}
        discovery_id: {type: string}
        query: {type: string}
        nodes:
          type: array
          items: {type: object, properties: {}, additionalProperties: true}
        edges:
          type: array
          items: {type: object, properties: {}, additionalProperties: true}
        truncated: {type: boolean}
      required: [schema_version, robot_id, discovery_id, query, nodes, edges, truncated]
      additionalProperties: false

  - <<: *defaults
    contract_id: evidence.resolve
    operation: evidence.resolve
    description: Resolve one bounded discovery evidence reference and return metadata only.
    canonical_cli: [robotctl, adapt, evidence, resolve, "{reference}", --robot, "{robot_id}"]
    input_schema:
      type: object
      properties: {reference: {type: string, minLength: 1}}
      required: [reference]
      additionalProperties: false
    output_schema:
      type: object
      properties:
        reference: {type: string}
        resolved_path: {type: string}
        authority: {type: string}
        kind: {type: string}
        size_bytes: {type: integer, minimum: 0}
        sha256: {type: string}
      required: [reference, resolved_path, authority, kind]
      additionalProperties: false

  - <<: *gateable_read_defaults
    contract_id: episode.list
    operation: episode.list
    description: List bounded episode metadata without returning event payloads or artifact contents.
    capability_requirements: [bounded Rolo episode metadata query route]
    postconditions:
      [Only episode metadata is returned; event payloads and referenced artifact contents are not read.]
    input_schema:
      type: object
      properties:
        since: {type: string}
        until: {type: string}
        state: {type: string}
        cursor: {type: string}
        limit: {type: integer, minimum: 1, maximum: 1000}
      required: [limit]
      additionalProperties: false
    output_schema:
      type: object
      properties:
        status: {type: string}
        items:
          type: array
          maxItems: 1000
          items:
            type: object
            properties:
              episode_id: {type: string}
              state: {type: string}
              started_at: {type: string}
              ended_at: {type: string}
              task_ref: {type: string}
            required: [episode_id, state, started_at]
            additionalProperties: false
        next_cursor: {type: string}
        observed_at: {type: string}
      required: [status, items, observed_at]
      additionalProperties: false

  - <<: *gateable_read_defaults
    contract_id: episode.inspect
    operation: episode.inspect
    description: Read one bounded episode manifest with event metadata and artifact references only.
    capability_requirements: [bounded Rolo episode manifest query route]
    postconditions:
      [The response contains a bounded manifest; referenced artifact contents are not resolved or inlined.]
    input_schema:
      type: object
      properties:
        episode_id: {type: string, minLength: 1}
        max_events: {type: integer, minimum: 1, maximum: 10000}
        max_artifacts: {type: integer, minimum: 1, maximum: 1000}
        max_bytes: {type: integer, minimum: 1024, maximum: 10000000}
      required: [episode_id, max_events, max_artifacts, max_bytes]
      additionalProperties: false
    output_schema:
      type: object
      properties:
        status: {type: string}
        episode_id: {type: string}
        state: {type: string}
        started_at: {type: string}
        ended_at: {type: string}
        events:
          type: array
          maxItems: 10000
          items:
            type: object
            properties:
              event_id: {type: string}
              type: {type: string}
              occurred_at: {type: string}
              source: {type: string}
            required: [event_id, type, occurred_at]
            additionalProperties: false
        artifacts:
          type: array
          maxItems: 1000
          items:
            type: object
            properties:
              artifact_ref: {type: string}
              media_type: {type: string}
              observed_at: {type: string}
            required: [artifact_ref]
            additionalProperties: false
        truncated: {type: boolean}
        observed_at: {type: string}
      required:
        [status, episode_id, state, started_at, events, artifacts, truncated, observed_at]
      additionalProperties: false

  - <<: *gateable_read_defaults
    contract_id: episode.export
    operation: episode.export
    description: Export one bounded episode manifest and artifact index without copying artifact contents.
    risk: R1
    observation_overhead: ELEVATED
    max_duration_s: 60
    capability_requirements: [bounded Rolo episode manifest export route]
    postconditions:
      [A protected manifest artifact is created; referenced business artifacts are not copied or inlined.]
    side_effects: [Consumes bounded serialization resources and creates one protected export artifact.]
    rate_limit: one episode export per robot at a time
    input_schema:
      type: object
      properties:
        episode_id: {type: string, minLength: 1}
        format: {type: string, enum: [json, jsonl]}
        max_bytes: {type: integer, minimum: 1024, maximum: 100000000}
      required: [episode_id, format, max_bytes]
      additionalProperties: false
    output_schema:
      type: object
      properties:
        status: {type: string}
        episode_id: {type: string}
        artifact_ref: {type: string}
        media_type: {type: string}
        bytes: {type: integer, minimum: 0}
        observed_at: {type: string}
      required: [status, episode_id, artifact_ref, media_type, bytes, observed_at]
      additionalProperties: false

  - <<: *gateable_read_defaults
    contract_id: checkpoint.list
    operation: checkpoint.list
    description: List bounded Rolo control-plane checkpoint metadata without resolving saved state.
    capability_requirements: [bounded Rolo checkpoint metadata query route]
    postconditions: [Saved control-plane state and referenced artifact contents are not returned.]
    input_schema:
      type: object
      properties:
        episode_id: {type: string}
        cursor: {type: string}
        limit: {type: integer, minimum: 1, maximum: 1000}
      required: [limit]
      additionalProperties: false
    output_schema:
      type: object
      properties:
        status: {type: string}
        items:
          type: array
          maxItems: 1000
          items:
            type: object
            properties:
              checkpoint_id: {type: string}
              episode_id: {type: string}
              label: {type: string}
              revision: {type: string}
              created_at: {type: string}
            required: [checkpoint_id, episode_id, revision, created_at]
            additionalProperties: false
        next_cursor: {type: string}
        observed_at: {type: string}
      required: [status, items, observed_at]
      additionalProperties: false

  - <<: *gateable_mutation_defaults
    contract_id: checkpoint.create
    operation: checkpoint.create
    description: Create an immutable Rolo control-plane state anchor without changing target state.
    capability_requirements:
      [Rolo checkpoint repository, protected OS write policy and exact operation allowlist]
    preconditions: [episode_id resolves to an episode visible to this robot identity.]
    postconditions:
      - >-
        The response acknowledges checkpoint creation and returns its identity; target
        configuration, processes, tasks and physical state are not changed.
    side_effects: [Creates immutable control-plane metadata and references in the checkpoint repository.]
    resource_locks: [Rolo checkpoint repository]
    input_schema:
      type: object
      properties:
        episode_id: {type: string, minLength: 1}
        label: {type: string, minLength: 1, maxLength: 256}
        scope:
          type: array
          minItems: 1
          maxItems: 4
          items:
            type: string
            enum: [state_graph, workflow_progress, configuration_refs, evidence_index]
      required: [episode_id, label, scope]
      additionalProperties: false
    output_schema:
      type: object
      properties:
        status: {type: string}
        checkpoint_id: {type: string}
        revision: {type: string}
        observed_at: {type: string}
      required: [status, checkpoint_id, revision, observed_at]
      additionalProperties: false

  - <<: *gateable_mutation_defaults
    contract_id: checkpoint.restore
    operation: checkpoint.restore
    description: Restore saved Rolo control-plane metadata without applying target state or resuming execution.
    capability_requirements:
      [Rolo checkpoint repository, optimistic revision check,
        protected OS write policy and exact operation allowlist]
    preconditions:
      - >-
        checkpoint_id resolves to this robot identity and expected_current_revision matches the
        active control-plane revision; no target execution is started by the restore route.
    postconditions:
      - >-
        The response acknowledges a new control-plane revision only; target parameters, services,
        processes, task execution and physical robot state are not restored or resumed.
    side_effects:
      [Creates a new active Rolo control-plane revision and replaces unsaved control-plane progress.]
    resource_locks: [Rolo active control-plane revision]
    input_schema:
      type: object
      properties:
        checkpoint_id: {type: string, minLength: 1}
        expected_current_revision: {type: string, minLength: 1}
        scope:
          type: array
          minItems: 1
          maxItems: 4
          items:
            type: string
            enum: [state_graph, workflow_progress, configuration_refs, evidence_index]
      required: [checkpoint_id, expected_current_revision, scope]
      additionalProperties: false
    output_schema:
      type: object
      properties:
        status: {type: string}
        checkpoint_id: {type: string}
        revision: {type: string}
        observed_at: {type: string}
      required: [status, checkpoint_id, revision, observed_at]
      additionalProperties: false
