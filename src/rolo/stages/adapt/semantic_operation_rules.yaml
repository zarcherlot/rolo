schema_version: rolo-semantic-operation-rules/v1
rules:
  - rule_id: base_velocity_command
    topic_segments: [cmd_vel]
    topic_prefixes: []
    semantic_uri: semantic://actuator/base/velocity_command
    operations: [app.teleop.velocity]

  - rule_id: base_odometry
    topic_segments: [odom, odometry]
    topic_prefixes: [odom_]
    semantic_uri: semantic://state/base/odometry
    # An Odometry message is a timestamped pose/velocity sample.  It does not
    # by itself prove localization readiness or quality, so do not infer the
    # status operation from the topic name alone.
    operations: [app.localization.pose, app.odometry.sample]

  - rule_id: lidar_observation
    topic_segments: [scan, pointcloud, points]
    topic_prefixes: [scan_, pointcloud_, points_]
    semantic_uri: semantic://sensor/lidar/observation
    operations: [app.lidar.snapshot]

  - rule_id: camera_image
    topic_segments: [image]
    topic_prefixes: [image_]
    semantic_uri: semantic://sensor/front_camera/image
    operations: [app.camera.snapshot]

  - rule_id: inertial_sample
    topic_segments: [imu, inertial]
    topic_prefixes: [imu_]
    semantic_uri: semantic://sensor/imu
    operations: [app.imu.sample]

  - rule_id: gnss_sample
    topic_segments: [fix, gnss, gps, navsat]
    topic_prefixes: [gnss_, gps_]
    semantic_uri: semantic://sensor/gnss/fix
    operations: [app.gnss.sample]

  - rule_id: map_metadata
    topic_segments: [map]
    topic_prefixes: [map_]
    semantic_uri: semantic://environment/map_2d
    operations: [app.map.inspect]

  - rule_id: battery_state
    topic_segments: [battery]
    topic_prefixes: [battery_]
    semantic_uri: semantic://power/battery_state
    operations: []
