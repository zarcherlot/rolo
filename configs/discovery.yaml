schema_version: robot-discovery-policy/v1
platform_baseline:
  architecture: arm64
  os: ubuntu
  os_versions: ["20.04", "22.04", "24.04"]
  ros_distributions: [foxy, humble, jazzy]
  supported_compute:
    - nvidia_jetson_orin
    - rockchip_rk3588
    - raspberry_pi
limits:
  command_timeout_s: 10
  max_command_output_bytes: 200000
  max_source_files: 10000
  max_discovered_items: 1000
software_inventory:
  collector_timeout_s: 30
  max_raw_bytes_per_collector: 52428800
  max_record_bytes: 65536
  # This is a chunk rollover limit, not a total-package limit. Additional
  # records continue in dpkg-0002.jsonl, dpkg-0003.jsonl, and so on.
  records_per_chunk: 1000
  bytes_per_chunk: 2097152
application:
  default_source_root: /opt/robot-application
  execute_discovered_binaries: false
  execute_readme_commands: false
  generated_write_tools_default: disabled_until_conformance
safety:
  shell_exec_exposed: false
  discovery_access: read_only
