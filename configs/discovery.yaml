schema_version: robot-discovery-policy/v1
platform_baseline:
  architecture: arm64
  os: ubuntu
  os_version: "22.04"
  ros_distribution: humble
  supported_compute:
    - nvidia_jetson_orin
    - rockchip_rk3588
    - raspberry_pi
limits:
  command_timeout_s: 10
  max_command_output_bytes: 200000
  max_source_files: 10000
  max_discovered_items: 1000
application:
  default_source_root: /opt/robot-application
  execute_discovered_binaries: false
  execute_readme_commands: false
  generated_write_tools_default: disabled_until_conformance
safety:
  shell_exec_exposed: false
  discovery_access: read_only
