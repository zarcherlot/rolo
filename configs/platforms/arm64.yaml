schema_version: robot-platform-compatibility/v1
architecture: arm64
kernel_architecture: aarch64
os:
  distribution: ubuntu
  version: "22.04"
ros:
  distribution: humble
supported_compute:
  - id: nvidia_jetson_orin
    name: NVIDIA Jetson Orin
    device_tree_patterns: ["jetson", "orin"]
  - id: rockchip_rk3588
    name: Rockchip RK3588
    device_tree_patterns: ["rk3588", "rockchip"]
  - id: raspberry_pi
    name: Raspberry Pi 4/5
    device_tree_patterns: ["raspberry pi"]
compatibility_contract:
  application_artifact: common
  vendor_bsp_and_driver: adapter_specific
  robot_profile_selects: [geometry, sensors, actuators, bindings, calibration, parameters]
