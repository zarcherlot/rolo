schema_version: robot-profile-template/v1
profile_id: differential_drive
description: Differential-drive mobile base with RGB camera and 2D lidar
adapter: mock
platform:
  architecture: arm64
  compute: auto_discover
  os: ubuntu
  ros_distro: auto_discover
  drive_model: differential
geometry:
  footprint_m:
    - [0.31, 0.23]
    - [0.31, -0.23]
    - [-0.29, -0.23]
    - [-0.29, 0.23]
  hard_max_linear_velocity_mps: 0.8
  hard_max_angular_velocity_radps: 1.5
sensors:
  front_camera:
    semantic_uri: semantic://sensor/front_camera
    modality: camera_rgb
    binding: unbound://sensor/front_camera
  range_primary:
    semantic_uri: semantic://sensor/front_lidar/scan
    modality: lidar_2d
    binding: unbound://sensor/range_primary
features:
  mapping_2d: true
  navigation_2d: true
  docking: true
  robot_use:
    supported: true
    local_visual_detection: false
    safety_authority: none
enrollment:
  requires_safety_confirmation: true
  requires_binding_conformance: true
  requires_calibration: true
