<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1400" viewBox="0 0 1600 1400" role="img" aria-labelledby="title desc">
  <title id="title">rolo logo concept comparison</title>
  <desc id="desc">Three white-background rolo logo directions labeled A, B, and C.</desc>
  <rect width="1600" height="1400" fill="#F7F8FA"/>
  <text x="100" y="88" fill="#171A22" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="44" font-weight="700">rolo identity directions</text>
  <text x="100" y="128" fill="#667085" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22">robot only loop once · A / B / C comparison</text>

  <g>
    <rect x="80" y="170" width="1440" height="360" rx="28" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="2"/>
    <rect x="112" y="202" width="74" height="44" rx="22" fill="#155EEF"/>
    <text x="149" y="232" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700" text-anchor="middle">A</text>
    <text x="210" y="230" fill="#171A22" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="700">ONE COMPLETE LOOP</text>
    <text x="1490" y="230" fill="#667085" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" text-anchor="end">direct · memorable · motion-led</text>
    <image href="rolo-logo-a-one-complete-loop.svg" x="380" y="238" width="840" height="280"/>
  </g>

  <g>
    <rect x="80" y="550" width="1440" height="360" rx="28" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="2"/>
    <rect x="112" y="582" width="74" height="44" rx="22" fill="#171A22"/>
    <text x="149" y="612" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700" text-anchor="middle">B</text>
    <text x="210" y="610" fill="#171A22" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="700">STATE FRAMES</text>
    <text x="1490" y="610" fill="#667085" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" text-anchor="end">systematic · technical · auditable</text>
    <image href="rolo-logo-b-state-frames.svg" x="380" y="618" width="840" height="280"/>
  </g>

  <g>
    <rect x="80" y="930" width="1440" height="360" rx="28" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="2"/>
    <rect x="112" y="962" width="74" height="44" rx="22" fill="#155EEF"/>
    <text x="149" y="992" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700" text-anchor="middle">C</text>
    <text x="210" y="990" fill="#171A22" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="700">LOOP EXIT</text>
    <text x="1490" y="990" fill="#155EEF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="end">SELECTED · independent · minimal</text>
    <image href="rolo-logo-c-single-stroke.svg" x="380" y="998" width="840" height="280"/>
  </g>

  <text x="800" y="1360" fill="#98A2B3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" text-anchor="middle">All directions use graphite #171A22 · loop blue #155EEF · white #FFFFFF</text>
</svg>
