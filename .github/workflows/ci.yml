name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
      - run: uv sync --locked --dev --python ${{ matrix.python-version }}
      - run: uv run --python ${{ matrix.python-version }} ruff check .
      - run: uv run --python ${{ matrix.python-version }} pytest

  lerobot-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
      - run: uv sync --locked --dev --python 3.12
      - name: Prepare real LeRobot CLI without the optional ML stack
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
          LEROBOT_COMMIT: "7427f31801f944f5ec9ce53cda02862ce7d1638b"
        run: |
          git init .ci/lerobot
          git -C .ci/lerobot remote add origin https://github.com/huggingface/lerobot.git
          git -C .ci/lerobot fetch --depth 1 origin "$LEROBOT_COMMIT"
          git -C .ci/lerobot checkout --detach FETCH_HEAD
          test "$(git -C .ci/lerobot rev-parse HEAD)" = "$LEROBOT_COMMIT"
          uv venv .ci/lerobot-venv --python 3.12
          uv pip install --python .ci/lerobot-venv/bin/python --no-deps -e .ci/lerobot
      - name: Run real LeRobot source-discovery acceptance
        env:
          ROLO_RUN_LEROBOT_E2E: "1"
          LEROBOT_ROOT: ${{ github.workspace }}/.ci/lerobot
          LEROBOT_INFO: ${{ github.workspace }}/.ci/lerobot-venv/bin/lerobot-info
        run: uv run pytest -q tests/test_lerobot_e2e.py
