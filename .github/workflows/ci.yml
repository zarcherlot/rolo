name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run ruff check src/rolo/api.py src/rolo/read_models.py src/rolo/workbench_read_models.py src/rolo/stages/contracts.py tests/test_api.py tests/test_read_models.py tests/test_workbench_read_models.py
      - run: uv run pytest tests/test_api.py tests/test_read_models.py tests/test_workbench_read_models.py tests/test_schemas.py
