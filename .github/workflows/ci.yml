name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate documentation layout and links
        run: python scripts/check_docs.py

  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
      - run: uv sync --locked --dev --python ${{ matrix.python-version }}
      - run: uv run --python ${{ matrix.python-version }} ruff check .
      - name: Run tests
        run: |
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            uv run --python ${{ matrix.python-version }} pytest \
              --cov=src/rolo \
              --cov-report=term-missing \
              --cov-report=xml \
              --cov-fail-under=84.00
          else
            uv run --python ${{ matrix.python-version }} pytest
          fi
      - name: Upload statement coverage fragment
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-verify
          path: |
            .coverage*
            coverage.xml
          include-hidden-files: true
          if-no-files-found: error

  real-verify-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
      - run: uv sync --locked --dev --python 3.12
      - name: Run real Verify provider conformance and evidence contract matrix
        run: >-
          uv run --python 3.12 pytest -q
          --cov=src/rolo --cov-report= --cov-fail-under=0
          tests/test_ssh_target_provider.py
          tests/test_ssh_provider_recovery.py
          tests/test_ssh_provider_handoff.py
          tests/test_ssh_provenance.py
          tests/test_product_cli.py
          tests/test_verify_readiness.py
          tests/test_target_evidence_deployment.py
          tests/test_stage_agent_runner.py
          tests/test_handoff_materializers.py
          tests/test_api.py
          tests/test_episode_api.py
      - name: Upload integration coverage fragment
        uses: actions/upload-artifact@v4
        with:
          name: coverage-real-verify
          path: .coverage*
          include-hidden-files: true
          if-no-files-found: error
      - name: Enforce canonical schema drift gate
        run: uv run --python 3.12 pytest -q tests/test_schemas.py

  coverage-merge:
    runs-on: ubuntu-latest
    needs: [verify, real-verify-contract, lerobot-e2e, production-sandbox, ssh-target-e2e]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
      - run: uv sync --locked --dev --python 3.12
      - name: Download coverage fragments
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: false
      - name: Combine and enforce coverage gate
        run: |
          for name in verify real-verify lerobot production-sandbox ssh-target; do
            cp "coverage-artifacts/coverage-${name}/.coverage" ".coverage.${name}"
          done
          uv run coverage combine
          uv run coverage report --fail-under=84.00
          uv run coverage xml -o coverage-merged.xml
      - name: Upload merged coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-merged
          path: coverage-merged.xml
          if-no-files-found: error

  package:
    runs-on: ubuntu-latest
    needs: [verify, docs, coverage-merge]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
      - run: uv sync --locked --dev --python 3.12
      - name: Run product release smoke checks
        run: uv run --python 3.12 rolo release-check
      - name: Build wheel and sdist
        run: uv build
      - name: Build and verify signed target companion
        run: |
          mkdir -p dist/companion
          printf 'ci-only-companion-key' > dist/companion/verification.key
          uv run --python 3.12 rolo target companion-build \
            --output-dir dist/companion \
            --version 0.1.0 \
            --architecture x86_64 \
            --publisher rolo \
            --verification-key-file dist/companion/verification.key
          uv run --python 3.12 rolo target companion-verify \
            dist/companion/manifest.json \
            dist/companion/rolo-target-0.1.0-x86_64 \
            --verification-key-file dist/companion/verification.key
          test -x dist/companion/rolo-target-0.1.0-x86_64
      - name: Verify build artifacts
        run: test -n "$(find dist -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) -print -quit)"
      - name: Re-run release check against built artifacts
        run: uv run --python 3.12 rolo release-check --require-artifacts

  lerobot-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
      - run: sudo apt-get update
      - run: sudo apt-get install --yes bubblewrap
      - name: Enable namespace prerequisites on the ephemeral CI runner
        run: |
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          for kind in cgroup ipc mnt net pid time user uts; do
            key="user.max_${kind}_namespaces"
            if sysctl -n "$key" >/dev/null 2>&1; then
              sudo sysctl -w "$key=15000"
            fi
          done
      - run: uv sync --locked --dev --python 3.12
      - name: Prepare real editable LeRobot camera CLI with minimal runtime dependencies
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
          LEROBOT_COMMIT: "7427f31801f944f5ec9ce53cda02862ce7d1638b"
        run: |
          git init .ci/lerobot
          git -C .ci/lerobot remote add origin https://github.com/huggingface/lerobot.git
          git -C .ci/lerobot fetch --depth 1 origin "$LEROBOT_COMMIT"
          git -C .ci/lerobot checkout --detach FETCH_HEAD
          test "$(git -C .ci/lerobot rev-parse HEAD)" = "$LEROBOT_COMMIT"
          uv venv .ci/lerobot-venv --python 3.12
          uv pip install --python .ci/lerobot-venv/bin/python --no-deps -e .ci/lerobot
          # The pinned LeRobot package imports torch unconditionally from
          # lerobot.utils, even for lerobot-find-cameras --help. Use the CPU
          # wheel index so this acceptance test does not pull a CUDA runtime.
          uv pip install --python .ci/lerobot-venv/bin/python \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.7.1"
          uv pip install --python .ci/lerobot-venv/bin/python \
            "numpy>=2.0.0,<2.3.0" \
            "opencv-python-headless>=4.9.0,<4.14.0" \
            "Pillow>=10.0.0,<13.0.0" \
            "draccus>=0.11.6,<0.12.0" \
            "huggingface-hub>=1.6.0,<2.0.0" \
            "packaging>=24.2,<26.0"
      - name: Run real LeRobot discovery and production-sandbox acceptance
        env:
          ROLO_RUN_LEROBOT_E2E: "1"
          LEROBOT_ROOT: ${{ github.workspace }}/.ci/lerobot
          LEROBOT_INFO: ${{ github.workspace }}/.ci/lerobot-venv/bin/lerobot-info
          LEROBOT_FIND_CAMERAS: ${{ github.workspace }}/.ci/lerobot-venv/bin/lerobot-find-cameras
        run: uv run pytest -q --cov=src/rolo --cov-report= --cov-fail-under=0 tests/test_lerobot_e2e.py
      - name: Upload integration coverage fragment
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lerobot
          path: .coverage*
          include-hidden-files: true
          if-no-files-found: error

  production-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - run: sudo apt-get update
      - run: sudo apt-get install --yes bubblewrap
      - name: Enable namespace prerequisites on the ephemeral CI runner
        run: |
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          for kind in cgroup ipc mnt net pid time user uts; do
            key="user.max_${kind}_namespaces"
            if sysctl -n "$key" >/dev/null 2>&1; then
              sudo sysctl -w "$key=15000"
            fi
          done
      - run: uv sync --locked --dev --python 3.12
      - run: uv run --python 3.12 pytest -q --cov=src/rolo --cov-report= --cov-fail-under=0 tests/test_production_sandbox.py
      - name: Upload integration coverage fragment
        uses: actions/upload-artifact@v4
        with:
          name: coverage-production-sandbox
          path: .coverage*
          include-hidden-files: true
          if-no-files-found: error

  ssh-target-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - run: sudo apt-get update
      - run: sudo apt-get install --yes openssh-client openssh-server
      - run: sudo install -d -m 0755 /run/sshd
      - run: uv sync --locked --dev --python 3.12
      - name: Run real SSH collector and preflight acceptance
        env:
          ROLO_RUN_SSH_E2E: "1"
        run: uv run --python 3.12 pytest -q --cov=src/rolo --cov-report= --cov-fail-under=0 tests/test_ssh_target_e2e.py
      - name: Upload integration coverage fragment
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ssh-target
          path: .coverage*
          include-hidden-files: true
          if-no-files-found: error
