name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate documentation layout and links
        run: python scripts/check_docs.py

  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
      - run: uv sync --locked --dev --python ${{ matrix.python-version }}
      - run: uv run --python ${{ matrix.python-version }} ruff check .
      - name: Run the v2 Probe chain tests
        run: >-
          uv run --python ${{ matrix.python-version }} pytest -q
          tests/test_target_credentials.py
          tests/test_target_executors.py
          tests/test_probe_evidence_contract.py
          tests/test_target_evidence_deployment.py -k "not allowlisted_target_help_is_signed_verified_and_merged_into_discovery and not target_help_cli_enrollment_and_collection_handoff and not remote_transport_rejects_in_place_known_hosts_change and not rotation_and_reenrollment_cli_preserve_explicit_handoff and not init_exposes_local_mode_as_install_time_choice and not local_init_is_idempotent_and_preserves_collector_pin and not discovery_uses_bound_target_probes_not_controller_host and not source_only_discovery_never_attributes_controller_probes and not legacy_remote_deployment_migrates_to_content_pins"
          tests/test_agent_native_tools.py
          tests/test_probe_session_factory.py
          tests/test_native_tool_session.py
          tests/test_tool_planning.py

  package:
    runs-on: ubuntu-latest
    needs: [probe, docs]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
      - run: uv sync --locked --dev --python 3.12
      - name: Run product release smoke checks
        run: uv run --python 3.12 rolo release-check
      - name: Build wheel and sdist
        run: uv build
      - name: Verify build artifacts
        run: test -n "$(find dist -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) -print -quit)"
      - name: Re-run release check against built artifacts
        run: uv run --python 3.12 rolo release-check --require-artifacts
